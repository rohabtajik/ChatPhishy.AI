<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AUSDIAS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Base Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background: linear-gradient(135deg, #f4f4f4, #e0e0e0);
        }

        h1, h2, p {
            margin: 0;
        }

        /* Navigation Bar */
        nav {
            background: linear-gradient(135deg, #004080, #0059b3);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav img {
            width: 75px; 
            height: auto;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        nav ul li a:hover {
            color: #ffcc00;
            transform: scale(1.1);
        }

        /* Highlight the active page link */
        nav ul li a.active {
            color: #ffcc00; /* Change to the desired color */
        }

        /* Contact Form Section */
        section {
            padding: 130px 20px;
            margin: 0 auto;
            max-width: 1200px;
        }

        .contact-form {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: 0 auto;
        }

        .contact-form h2 {
            text-align: center;
            color: #004080;
            margin-bottom: 20px;
        }

        .contact-form label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
        }

        .contact-form input, 
        .contact-form textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .contact-form textarea {
            height: 150px;
            resize: none;
        }

        .contact-form button {
            display: inline-block;
            width: 100%;
            padding: 15px;
            color: #fff;
            background-color: #004080;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            font-size: 16px;
        }

        .contact-form button:hover {
            background-color: #003366;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }

        /* Contact Info Section */
        .contact-info {
            text-align: center;
            margin-top: 40px;
        }

        .contact-info p {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 10px;
        }

        .contact-info strong {
            font-weight: 600;
            color: #004080;
        }

        /* Map Section */
        .map {
            margin-top: 40px;
            text-align: center;
        }

        .map iframe {
            width: 100%;
            max-width: 800px;
            height: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        /* Footer Styles */
        footer {
            background-color: #004080;
            color: #fff;
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
        }

        footer p {
            margin: 0;
            font-size: 0.7rem;
        }

    </style>

</head>
<body>

<!-- Navigation Bar -->
<nav>
    <div class="container">
        <div class="logo">
            <img src="../static/images/logo.png" alt="AUSDIAS Logo">


        </div>
        <ul>
            <li><a href="{{ url_for('chatbot') }}" >Chatbot</a></li>
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('aboutus') }}">About Us</a></li>
            <li><a href="{{ url_for('services') }}">Services</a></li>
            <li><a href="{{ url_for('contactus') }}"class="active">Contact Us</a></li>
            <li><a href="{{ url_for('login') }}">Login</a></li>
        </ul>
    </div>
</nav>
<!-- Contact Form Section -->
<section>
    <div class="contact-form">
        <h2>Contact Us</h2>
        <form action="#" method="POST">
            <!-- CSRF Token (for security) -->
            <input type="hidden" name="csrf_token" value="your_token_here">

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required aria-required="true" aria-labelledby="name">
            
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required aria-required="true" aria-labelledby="email">

            <label for="message">Your Message</label>
            <textarea id="message" name="message" placeholder="Write your message" required aria-required="true" aria-labelledby="message"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>
</section>

<!-- Contact Information Section -->
<div class="contact-info">
    <p><strong>Address:</strong> Bundoora, Melbourne, Australia</p>
    <p><strong>Email:</strong> <a href="mailto:info@ausdais.com">info@ausdais.com</a></p>
    <p><strong>Phone:</strong> <a href="tel:+61312345678">+61 3 1234 5678</a></p>
</div>

<!-- Map Section -->
<div class="map">
    <h2>Find Us Here</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509428!2d144.95592831590452!3d-37.81720997975153!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf57700f0a29da183!2s123%20Data%20St%2C%20Melbourne%20VIC%203001%2C%20Australia!5e0!3m2!1sen!2sus!4v1632765151101!5m2!1sen!2sus" loading="lazy" allowfullscreen></iframe>
</div>

   <!-- Footer -->
      <footer>
        <div class="container">
            <p>&copy; {{ current_year }} AusDAIS. All rights reserved.</p>
        </div>
    </footer>


</body>
</html>
